# ─────────────────────────────────────────────────────────────────────────────
# DISCLAIMER — Training / educational example only.
# Do NOT deploy as-is in production. Review credentials, hostnames, cert
# issuers, resource sizing, persistence, and disabled subcharts first.
# ─────────────────────────────────────────────────────────────────────────────
# Consumer deployment example for DSC chart 10.4.12.
# A consumer ISSUES VCs to its own users and publishes its DID; nothing else.
# No Verifier/CCS/TIL/APISIX/Scorpio/TMForum/Marketplace.

# Off = `issuance-secret` is provisioned externally (sealed-secrets/Vault).
# Must contain at least `keycloak-admin` and `store-pass`.
issuance:
  generatePasswords:
    enabled: false

# cert-manager: Keycloak ingress TLS + DID EC keypair (used for VC signing).
cert-manager:
  enabled: true
certManagerResources:
  enabled: true
  namespace: cert-manager
  type: "prod"

# Enable only Zalando managedPostgres (used by Keycloak) from decentralized-iam.
# All authn/authz services stay OFF — a pure consumer doesn't verify VCs.
decentralizedIam:
  enabled: true
  vcAuthentication:
    enabled: true
    # Cluster-wide Zalando postgres-operator. Set to `false` if already installed elsewhere.
    postgres-operator:
      enabled: true
    managedPostgres:
      enabled: true
      config:
        teamId: "consumer"
        numberOfInstances: 1
        postgresql:
          version: "16"
        volume:
          size: 4Gi
          storageClass: gp2  # AWS EKS — change for non-EKS clusters
        users:
          admin:    [superuser, createdb]
          keycloak: [createdb]
        databases:
          keycloakdb: keycloak
    trusted-issuers-list:        { enabled: false }
    credentials-config-service:  { enabled: false }
    vcverifier:                  { enabled: false }
  odrlAuthorization:   { enabled: false }

# Everything else a consumer does NOT need.
mongo-operator:      { enabled: false }
managedMongo:        { enabled: false }
scorpio:             { enabled: false }
tm-forum-api:        { enabled: false }
contract-management: { enabled: false }
fdsc-dashboard:      { enabled: false }
marketplace:         { enabled: false }
vault:               { enabled: false }
fdsc-edc:            { enabled: false }
identityhub:         { enabled: false }
elsi:                { enabled: false }
rainbow:             { enabled: false }
dataSpaceConfig:     { enabled: false }
registration:        { enabled: false }
credentials:         { enabled: false }

# Keycloak: VC Issuer (OID4VCI) for the consumer's own users.
# DSC 10.4.x uses the CloudPirates Keycloak chart (0.21.28) with the UPSTREAM
# image `docker.io/keycloak/keycloak:26.7.0` as the chart default — no image
# override needed. The SEAMWARE fork (quay.io/seamware/keycloak:26.6.3) existed
# only to carry the OID4VCI QR-endpoint fix (keycloak/keycloak#44623) and the
# Liquibase changeset `26.7.0-verifiable-credential`; both are upstream in
# 26.7.0, so it was dropped in 10.4.0. The umbrella still enables the three
# oid4vc-vci feature flags.
keycloak:
  enabled: true
  metrics: { enabled: true }
  # Admin credentials live under the CloudPirates `keycloak.keycloak.*` block.
  keycloak:
    adminUser: keycloak-admin
    existingSecret: issuance-secret
    secretKeys:
      adminPasswordKey: keycloak-admin
    proxyHeaders: xforwarded
  tls: { enabled: false }
  service:
    httpPort: 8080
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/common-name: accounts-consumer.example.com
      cert-manager.io/cluster-issuer: prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: accounts-consumer.example.com
        paths:
          - { path: /, pathType: Prefix }
    tls:
      - secretName: accounts-consumer.example.com-tls
        hosts: [accounts-consumer.example.com]
  resources:
    requests: { memory: "500Mi", cpu: "0.5" }
    limits:   { memory: "2Gi",   cpu: "1" }
  livenessProbe:  { failureThreshold: 20 }
  readinessProbe: { failureThreshold: 20 }
  # Use the Zalando-managed Postgres declared above instead of the bundled one.
  postgres: { enabled: false }
  database:
    host: postgres
    name: keycloakdb
    username: keycloak
    existingSecret: keycloak.postgres.credentials.postgresql.acid.zalan.do
    secretKeys:
      usernameKey: username
      passwordKey: password
  extraVolumeMounts:
    # Since Keycloak 26.6.4 the `java-keystore` realm key provider only reads
    # keystores under `${kc.home.dir}/data/<realm-name>` (/opt/keycloak/data on
    # the official image). The directory name MUST equal `keycloak.realm.name`
    # below; keystores outside that boundary break any update of the key provider.
    # The `get-did` initContainer keeps its own /did-material view of the same
    # emptyDir — only the Keycloak container's mount is constrained.
    - { name: did-material, mountPath: /opt/keycloak/data/consumer }
    - { name: realms,       mountPath: /opt/keycloak/data/import }
  extraVolumes:
    - name: did-material
      emptyDir: {}
    - name: realms
      # ConfigMap rendered by the chart from `keycloak.realm` below.
      configMap: { name: consumer-realm }
    - name: did-priv-key
      secret: { secretName: did-consumer.example.com-tls }
  # Builds a PKCS12 keystore from the cert-manager PEM keypair (Keycloak signs VCs
  # from PKCS12, not PEM). Alias `didPrivateKey` matches `signingKey.keyAlias`.
  extraInitContainers:
    - name: get-did
      image: alpine/openssl:3.5.5
      command: ["/bin/sh", "-c"]
      args:
        - |
          openssl pkcs12 -export \
            -in /certs-did/tls.crt \
            -inkey /certs-did/tls.key \
            -out /did-material/cert.pfx \
            -name "didPrivateKey" \
            -passout env:STORE_PASS
          chmod 644 /did-material/cert.pfx
      env:
        - name: STORE_PASS
          valueFrom:
            secretKeyRef: { name: issuance-secret, key: store-pass }
      volumeMounts:
        - { name: did-material, mountPath: /did-material }
        - { name: did-priv-key, mountPath: /certs-did }
  # The umbrella enables the OID4VCI feature flags and `--import-realm` by default.
  # extraEnvVars REPLACES the umbrella list, so KC_HEAP_SIZE must be repeated here.
  # DID → substituted into ${DID} at realm import time.
  extraEnvVars:
    - name: KC_HEAP_SIZE
      value: "1024m"
    - name: DID
      value: did:web:did-consumer.example.com:did
    - name: STORE_PASS
      valueFrom:
        secretKeyRef: { name: issuance-secret, key: store-pass }

  # Realm structured import.
  realm:
    import: true
    name: consumer
    frontendUrl: https://accounts-consumer.example.com
    sslRequired: none
    # Keycloak 26.7.0 ties /create-credential-offer to a per-user
    # verifiableCredentials list; auto-assign the full declared set to every user.
    wallets:
      issueCredentialsToUsers: true

    # Client roles per Keycloak client.
    # ${DID}                                  → self-client (LegalPersonCredential)
    # did:web:did-provider.example.com:did    → target peer (OperatorCredential)
    clientRoles:
      ${DID}:
        - { name: customer, description: "Identifies the consumer org",      clientRole: true }
        - { name: admin,    description: "Admin role inside the consumer",   clientRole: true }
      did:web:did-provider.example.com:did:
        - { name: OPERATOR, description: "Allowed to operate the provider's services", clientRole: true }

    users:
      - username: employee
        enabled: true
        email: employee@consumer.org
        firstName: Test
        lastName: User
        credentials:
          - { type: password, value: "test" }
        clientRoles:
          ${DID}: [customer]
          did:web:did-provider.example.com:did: [OPERATOR]
          account: [view-profile, manage-account]

    # Convention: ONE client per *target participant*, `clientId == that peer's DID`.
    # Roles assigned on that client → emitted in the VC with `target` = that DID
    # (via oid4vc-target-role-mapper). Add one client per provider you consume from.
    clients:
      - clientId: ${DID}
        enabled: true
        description: Self client (LegalPersonCredential)
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        standardFlowEnabled: true
        protocol: oid4vc
        protocolMappers: []
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: []
      - clientId: did:web:did-provider.example.com:did
        enabled: true
        description: Target client for accessing the provider's services
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        standardFlowEnabled: true
        protocol: oid4vc
        protocolMappers: []
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: []

    # VC types this realm issues (OID4VCI, post-KC 26.4 model). Each entry renders one
    # ClientScope (protocol "oid4vc"); the key is the credential_configuration_id.
    # `credential_signing_alg` MUST match `signingKey.keyAlgorithm` and the key inside
    # the PKCS12 keystore. Mappers populate `credentialSubject`:
    #   oid4vc-context-mapper        → JSON-LD @context entries
    #   oid4vc-user-attribute-mapper → copy Keycloak user attribute → VC claim (claim.name)
    #   oid4vc-target-role-mapper    → roles on client `config.clientId`, scoped to that target DID
    verifiableCredentials:

      # Identity credential — self-issued, roles scoped to the consumer's own DID.
      legal-person-sd:
        attributes:
          format: "dc+sd-jwt"
          verifiable_credential_type: "LegalPersonCredential"
          credential_signing_alg: "ES256"
          credential_build_config.token_jws_type: "dc+sd-jwt"
          # SD-JWT red list (iss,iat,nbf,exp,cnf,vct,status) MUST stay disclosed.
          credential_build_config.sd_jwt.visible_claims: "iss,iat,nbf,exp,cnf,vct,status,roles,email"
          sd_jwt.number_of_decoys: "3"
          binding_required: "false"
          binding_required_proof_types: "jwt"
          cryptographic_binding_methods_supported: "jwk"
        protocolMappers:
          - name: context-mapper-lps
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
          - name: email-mapper-lps
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: email
              userAttribute: email
          - name: firstName-mapper-lps
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: firstName
              userAttribute: firstName
          - name: lastName-mapper-lps
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: lastName
              userAttribute: lastName
          - name: role-mapper-lps
            protocol: oid4vc
            protocolMapper: oid4vc-target-role-mapper
            config:
              claim.name: roles
              clientId: ${DID}

      # Access credential — roles scoped to the target provider's DID.
      # Duplicate this block per provider you consume from, changing the role-mapper clientId.
      operator-sd:
        attributes:
          format: "dc+sd-jwt"
          verifiable_credential_type: "OperatorCredential"
          credential_signing_alg: "ES256"
          credential_build_config.token_jws_type: "dc+sd-jwt"
          credential_build_config.sd_jwt.visible_claims: "iss,iat,nbf,exp,cnf,vct,status,roles,email"
          sd_jwt.number_of_decoys: "3"
          binding_required: "false"
          binding_required_proof_types: "jwt"
          cryptographic_binding_methods_supported: "jwk"
        protocolMappers:
          - name: context-mapper-ops
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
          - name: email-mapper-ops
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: email
              userAttribute: email
          - name: firstName-mapper-ops
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: firstName
              userAttribute: firstName
          - name: lastName-mapper-ops
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: lastName
              userAttribute: lastName
          - name: role-mapper-ops
            protocol: oid4vc
            protocolMapper: oid4vc-target-role-mapper
            config:
              claim.name: roles
              clientId: did:web:did-provider.example.com:did

  # `keyAlgorithm` must match the PKCS12 key and each VC's `credential_signing_alg`.
  signingKey:
    storePath: /opt/keycloak/data/consumer/cert.pfx
    storePassword: "${STORE_PASS}"
    keyAlias: didPrivateKey
    keyPassword: "${STORE_PASS}"
    keyAlgorithm: ES256
    did: did:web:did-consumer.example.com:did

# Publishes the DID Document at https://did-consumer.example.com/did/did.json.
# Ingress must be reachable by every dataspace peer.
# Use `did:web` (not `did:key`) — `did:key` ties the identity to the key, blocking rotation.
did:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: prod
      cert-manager.io/common-name: did-consumer.example.com
      cert-manager.io/private-key-algorithm: ECDSA
      cert-manager.io/private-key-encoding: PKCS8
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: did-consumer.example.com
        paths:
          - { path: /, pathType: Prefix }
    tls:
      - secretName: did-consumer.example.com-tls
        hosts: [did-consumer.example.com]
  volumes:
    - name: certs
      secret:
        secretName: did-consumer.example.com-tls
        items:
          - { key: tls.crt, path: tls.crt }
  volumeMounts:
    - { name: certs, mountPath: /certs }
  config:
    server:
      runServer: "true"
      certPath: /certs/tls.crt
      hostUrl: "https://did-consumer.example.com/did" # did:web:did-consumer.example.com:did
      keystorePasswordSecretName: ""
      keystorePasswordSecretKey: ""
      keyAlias: "myAlias"
    generateKey:
      enabled: false
