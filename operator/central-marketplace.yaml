# ─────────────────────────────────────────────────────────────────────────────
# DISCLAIMER — Training / educational example only.
# Do NOT deploy as-is in production. The seed user password is hardcoded
# ("test") for the bootstrap flow; review credentials, hostnames, cert
# issuers, resource sizing, persistence, and disabled subcharts first.
# ─────────────────────────────────────────────────────────────────────────────
# Central marketplace deployment — counterpart to provider.yaml. Hosts the
# dataspace-wide marketplace (BAE) and the central Keycloak (IdP for the
# onboarding portal). Also owns the shared Postgres cluster used by the
# `trust-anchor` namespace (TIR + onboarding) via cross-namespace secrets.

# Off = `issuance-secret` is provisioned externally (sealed-secrets/Vault).
issuance:
  generatePasswords:
    enabled: false

# Mongo (required by Marketplace/BAE). Sizes below are dev-scale.
mongo-operator:
  enabled: true
  community-operator-crds:
    enabled: true

managedMongo:
  enabled: true
  # -- spec as defined in https://github.com/mongodb/helm-charts/tree/main/charts/community-operator-crds
  spec:
    additionalMongodConfig:
      storage.wiredTiger.engineConfig.journalCompressor: zlib
    statefulSet:
      spec:
        template:
          spec:
            containers:
              - name: mongod
                resources:
                  limits:
                    cpu: "0.2"
                    memory: 250M
                  requests:
                    cpu: "0.1"
                    memory: 200M
              - name: mongodb-agent
                resources:
                  limits:
                    cpu: "0.2"
                    memory: 250M
                  requests:
                    cpu: "0.1"
                    memory: 200M
        volumeClaimTemplates:
          - metadata:
              name: data-volume
            spec:
              storageClassName: gp2  # AWS EKS — change for non-EKS clusters
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
          - metadata:
              name: logs-volume
            spec:
              storageClassName: gp2  # AWS EKS — change for non-EKS clusters
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

# decentralizedIam: only AuthN is enabled here (no ODRL/APISIX on the
# central marketplace — gated access is enforced at the provider side).
decentralizedIam:
  enabled: true

  vcAuthentication:
    enabled: true

    # `enable_cross_namespace_secret: true` lets the Zalando operator create
    # per-user Secrets in OTHER namespaces (e.g. trust-anchor). Required
    # because TIR + onboarding portal live in `trust-anchor` but reuse this
    # cluster — see the `trust-anchor.tir` / `trust-anchor.onboarding` users below.
    postgres-operator:
      configKubernetes:
        enable_cross_namespace_secret: true

    # Shared Zalando Postgres cluster for TIL/CCS/Keycloak/Scorpio +
    # the trust-anchor's TIR and onboarding portal databases.
    # Username pattern `<namespace>.<user>` → Secret materialised in that namespace.
    managedPostgres:
      enabled: true
      config:
        teamId: "dsc"
        numberOfInstances: 1
        postgresql:
          version: "16"
        volume:
          size: 1Gi
          storageClass: gp2  # AWS EKS — change for non-EKS clusters
        users:
          admin: # maintainer
            - superuser
            - createdb
          til:
            - createdb
          ccs:
            - createdb
          scorpio:
            - createdb
            - superuser
          keycloak:
            - createdb
          trust-anchor.tir:           # Secret materialised in `trust-anchor` ns
            - createdb
          trust-anchor.onboarding:    # Secret materialised in `trust-anchor` ns
            - createdb
        databases:
          tildb: til
          ccsdb: ccs
          scorpio: scorpio
          keycloak: keycloak
          tirdb: trust-anchor.tir
          onboarding: trust-anchor.onboarding
    # TIL: local "is issuer X trusted for credential Y?" service. Internal-only.
    trusted-issuers-list:
      enabled: true
      fullnameOverride: trusted-issuers-list
      database:
        persistence: true
        dialect: POSTGRES
        username: til
        existingSecret:
          enabled: true
          name: til.postgres.credentials.postgresql.acid.zalan.do
          key: password
        host: postgres
        port: 5432
        name: tildb

    # Verifier: OIDC endpoint that exchanges a VC for a JWT (via OID4VP).
    # `keyAlgorithm: RS256` mandatory — APISIX's lua-resty-openidc can't
    # verify EC JWTs (https://github.com/zmartzone/lua-resty-openidc/pull/457).
    # Two keys mounted:
    #   /certs         → ECDSA TLS cert for `x509_san_dns` client identification
    #   /certs-signing → RSA token-signing key
    vcverifier:
      enabled: true
      fullnameOverride: verifier
      m2m:
        authEnabled: false
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: prod
          cert-manager.io/private-key-algorithm: "ECDSA"
          cert-manager.io/common-name: "verifier-central-marketplace.example.com"
        hosts:
          - host: "verifier-central-marketplace.example.com"
            paths:
              - "/"
        tls:
          - secretName: verifier-central-marketplace.example.com-tls
            hosts:
              - verifier-central-marketplace.example.com
      deployment:
        logging:
          level: debug
        verifier:
          tirAddress: http://trusted-issuers-list:8080/
          did: did:web:did-central-marketplace.example.com
          supportedModes: ["byValue", "byReference"]
          generateKey: false
          keyAlgorithm: RS256
          sessionExpiry: 60
          keyPath: /certs-signing/tls.key
          clientIdentification:
            kid: "random-kid1"
            keyPath: /certs/tls.key
            requestKeyAlgorithm: ES256
            id: x509_san_dns:verifier-central-marketplace.example.com
            certificatePath: /certs/tls.crt
        server:
          host: https://verifier-central-marketplace.example.com
        configRepo:
          configEndpoint: http://credentials-config-service:8080
        additionalVolumes:
          - name: certs-vol
            secret:
              secretName: verifier-central-marketplace.example.com-tls
          - name: signing-certs-vol
            secret:
              secretName: verifier-rsa-cert
        additionalVolumeMounts:
          - name: certs-vol
            mountPath: /certs
          - name: signing-certs-vol
            mountPath: /certs-signing
        # Auto-registers this DID at the dataspace TIR. Dev/test only —
        # in prod participants are registered via the onboarding portal.
        initContainers:
          - name: register-at-tir
            image: curlimages/curl:8.7.1
            args:
              - -v
              - -X
              - POST
              - "http://tir.trust-anchor.svc.cluster.local:8080/issuer"
              - -H
              - "Content-Type: application/json"
              - -d
              - '{"did": "did:web:did-central-marketplace.example.com", "credentials": []}'
    # CCS: per-service config "to access X, present VC of type Y from issuer Z".
    # Two scopes registered for the central marketplace login flow.
    credentials-config-service:
      enabled: true
      fullnameOverride: credentials-config-service
      ingress:
        enabled: false
      database:
        persistence: true
        host: postgres
        dialect: postgres
        port: 5432
        name: ccsdb
        username: ccs
        existingSecret:
          enabled: true
          name: ccs.postgres.credentials.postgresql.acid.zalan.do
          key: password
      registration:
        enabled: true
        prepScript: export DID=did:web:did-central-marketplace.example.com
        services:
          - id: ${DID}
            defaultOidcScope: default
            authorizationType: "FRONTEND_V2"
            oidcScopes:
              default:
                credentials:
                  - type: LegalPersonCredential
                    trustedParticipantsLists:
                      - https://tir.example.com
                    trustedIssuersLists:
                      - http://trusted-issuers-list:8080
                    jwtInclusion:
                      enabled: true
                      fullInclusion: true
                presentationDefinition:
                  id: pd
                  input_descriptors:
                    - id: descriptor
                      constraints:
                        fields:
                          - id: vct
                            path:
                              - $.vct
                            filter:
                              const: "LegalPersonCredential"
                          - id: subject
                            path:
                              - $.firstName
                          - id: roles
                            path:
                              - $.roles
                      format:
                        "vc+sd-jwt":
                          alg:
                            - ES256
                  format:
                    "vc+sd-jwt":
                      alg:
                        - ES256
              "openid learcredential":
                credentials:
                  - type: LegalPersonCredential
                    trustedParticipantsLists:
                      - https://tir.example.com
                    trustedIssuersLists:
                      - http://trusted-issuers-list:8080
                    jwtInclusion:
                      enabled: true
                      fullInclusion: true
                presentationDefinition:
                  id: pd
                  input_descriptors:
                    - id: descriptor
                      constraints:
                        fields:
                          - id: vct
                            path:
                              - $.vct
                            filter:
                              const: "LegalPersonCredential"
                          - id: subject
                            path:
                              - $.firstName
                          - id: roles
                            path:
                              - $.roles
                      format:
                        "vc+sd-jwt":
                          alg:
                            - ES256
                  format:
                    "vc+sd-jwt":
                      alg:
                        - ES256

  # ODRL/APISIX stack disabled — the central marketplace exposes its UI
  # directly via nginx Ingress; only the provider gates access with ODRL.
  odrlAuthorization:
    enabled: false

# Scorpio (NGSI-LD broker) backing TMForum data persistence.
scorpio:
  fullnameOverride: data-service-scorpio
  enabled: true
  image:
    # Resource-friendly all-in-one image (Kafka-less, Java build).
    repository: scorpiobroker/all-in-one-runner
    tag: java-4.1.10
  db:
    dbhost: postgres
    user: scorpio
    existingSecret:
      enabled: true
      name: scorpio.postgres.credentials.postgresql.acid.zalan.do
      key: password
  additionalEnvVars:
    - name: DBNAME
      value: scorpio
  ingress:
    enabled: false
  readinessProbe:
    path: /q/health  # older versions used /actuator/health
  livenessProbe:
    path: /q/health  # older versions used /actuator/health
  service:
    type: ClusterIP
  # No auto-registration at CCS — Scorpio is internal here, not a sold data-service.
  ccs:
    enabled: false
    endpoint: http://credentials-config-service:8080
    configMap: scorpio-registration

  additionalVolumes:
    - name: scorpio-registration
      configMap:
        name: scorpio-registration
        defaultMode: 0755

# Keycloak: dual role — IDP for humans + VC Issuer (OID4VCI). Realm `central`.
# The org DID private key MUST be Keycloak's VC-signing key (see `get-did` initContainer).
# Bitnami moved the image to `bitnamilegacy/keycloak`; override repo + allowInsecureImages,
# otherwise ImagePullBackOff.
keycloak:
  kubeVersion: 1.34-1
  metrics:
    enabled: true
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/keycloak
  # Quarkus image requires the container security context disabled (fixed in future chart versions).
  containerSecurityContext:
    enabled: false
  ingress:
    pathType: Prefix
    annotations:
      cert-manager.io/common-name: accounts-central.example.com
      cert-manager.io/cluster-issuer: prod
      kubernetes.io/ingress.class: "nginx"
    enabled: true
    hostname: accounts-central.example.com
    ingressClassName: nginx
    tls: true
  proxyHeaders: xforwarded
  proxy: edge
  tls:
    enabled: false
  service:
    ports:
      http: 8080
    extraPorts:
      - name: management
        port: 9000
        targetPort: 9000
  auth:
    existingSecret: issuance-secret
    passwordSecretKey: keycloak-admin
    adminUser: keycloak-admin

  # Bumped above Bitnami defaults to prevent OOMs on linux kernel >=6.14.
  resources:
    requests:
      memory: "500Mi"
      cpu: "0.5"
    limits:
      memory: "2Gi"
      cpu: "1"

  # Increased thresholds to prevent crashloops on low-resource deployments.
  livenessProbe:
    failureThreshold: 20
  readinessProbe:
    failureThreshold: 20

  postgresql:
    enabled: false
  externalDatabase:
    host: postgres
    database: keycloak
    user: keycloak
    existingSecret: keycloak.postgres.credentials.postgresql.acid.zalan.do
    existingSecretPasswordKey: password

  extraVolumeMounts:
    - mountPath: /did-material
      name: did-material
    - mountPath: /opt/bitnami/keycloak/data/import
      name: realms
  extraVolumes:
    - emptyDir: {}
      name: did-material
    # ConfigMap rendered by the chart from `keycloak.realm` below.
    - configMap:
        name: central-realm
      name: realms
    - name: did-priv-key
      secret:
        secretName: did-central-marketplace.example.com-tls
    - name: ca-cert
      secret:
        secretName: ca-cert
  # Builds a PKCS12 keystore from the cert-manager PEM keypair (Keycloak signs
  # VCs from PKCS12, not PEM). Alias `didPrivateKey` matches `signingKey.keyAlias`.
  initContainers:
    - name: get-did
      image: alpine/openssl:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          openssl pkcs12 -export \
            -in /certs-did/tls.crt \
            -inkey /certs-did/tls.key \
            -out /did-material/cert.pfx \
            -certfile /ca-certs/ca.crt \
            -name "didPrivateKey" \
            -passout env:STORE_PASS
          chmod 644 /did-material/cert.pfx
      env:
        - name: STORE_PASS
          valueFrom:
            secretKeyRef:
              name: issuance-secret
              key: store-pass
      volumeMounts:
        - name: did-material
          mountPath: /did-material
        - name: did-priv-key
          mountPath: /certs-did
        - name: ca-cert
          mountPath: /ca-certs
  # KC_FEATURES=oid4vc-vci → enables the OID4VCI issuer (preview feature).
  # --import-realm         → loads the realm JSON from `keycloak.realm` on startup.
  # KC_HEAP_SIZE           → matches the memory requests; otherwise OOM.
  # DID                    → substituted into ${DID} at realm import time.
  extraEnvVars:
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm --health-enabled true"
    - name: KC_FEATURES
      value: "oid4vc-vci"
    - name: KC_HEAP_SIZE
      value: "1024m"
    - name: DID
      value: did:web:did-central-marketplace.example.com
    - name: STORE_PASS
      valueFrom:
        secretKeyRef:
          name: issuance-secret
          key: store-pass
  # Realm structured import.
  realm:
    import: true
    name: central
    frontendURL: https://accounts-central.example.com

    # Convention: ONE client per *target participant*, `clientId == that peer's DID`.
    # Roles assigned on that client → emitted in the VC with `target` = that DID
    # (via oid4vc-target-role-mapper).
    clientRoles:
      ${DID}:
        - name: "customer"
          description: "Is allowed to see offers etc."
          clientRole: true
        - name: "OPERATOR"
          description: "Is allowed to operate clusters."
          clientRole: true
        - name: "REPRESENTATIVE"
          description: "Is allowed to register."
          clientRole: true
        - name: "consumer"
          description: "Consumer role"
          clientRole: true
        - name: "seller"
          description: "Seller role"
          clientRole: true
    # Seed user for the bootstrap flow. Password is anchored (&employee_password)
    # and reused below by the `credentials` subchart to fetch a marketplace-credential.
    # WARNING: hardcoded password — training only, replace with a Secret-backed
    # value (or rotate immediately) in any non-disposable environment.
    users:
      - username: employee
        enabled: true
        email: employee@provider.org
        firstName: Employee
        lastName: Test
        credentials:
          - type: password
            value: &employee_password "test"
        clientRoles:
          ${DID}:
            - OPERATOR
            - REPRESENTATIVE
            - consumer
          account:
            - view-profile
            - manage-account
        groups: []
    # Self-client (clientId = own DID). Default clients added to avoid issues
    # with account-console after the realm import.
    clients:
      - clientId: ${DID}
        enabled: true
        description: Client to manage itself
        surrogateAuthRequired: false
        alwaysDisplayInConsole: false
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        bearerOnly: false
        consentRequired: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        publicClient: false
        frontchannelLogout: false
        protocol: oid4vc
        protocolMappers: []
        authenticationFlowBindingOverrides: {}
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: []
    # VC types this realm issues (OID4VCI):
    #   user-sd               → SD-JWT LegalPersonCredential for participant login
    #   marketplace-credential → JWT VC consumed by contract-management for API access
    # `credential_signing_alg_values_supported` MUST match `signingKey.keyAlgorithm`
    # and the algorithm of the key inside the PKCS12 keystore.
    verifiableCredentials:
      user-sd:
        attributes:
          credential_signing_alg_values_supported: ES256
          credential_build_config.signing_algorithm: ES256
          credential_build_config.token_jws_type: vc+sd-jwt
          credential_build_config.proof_types_supported:
            jwt:
              proof_signing_alg_values_supported:
                - ES256
          format: vc+sd-jwt
          scope: LegalPersonCredential
          vct: LegalPersonCredential
          credential_build_config.visible_claims: roles,email
          credential_build_config.decoys: 3
        clientScope:
          create: true
        protocolMappers:
          - name: context-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
              supportedCredentialTypes: LegalPersonCredential
          - name: email-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              subjectProperty: email
              userAttribute: email
              supportedCredentialTypes: LegalPersonCredential
          - name: firstName-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              subjectProperty: firstName
              userAttribute: firstName
              supportedCredentialTypes: LegalPersonCredential
          - name: lastName-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              subjectProperty: lastName
              userAttribute: lastName
              supportedCredentialTypes: LegalPersonCredential
          - name: role-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-target-role-mapper
            config:
              subjectProperty: roles
              clientId: ${DID}
              supportedCredentialTypes: LegalPersonCredential
      # Plain JWT VC (not SD-JWT). Consumed by contract-management to call
      # other participants' TMForum APIs on behalf of the marketplace.
      marketplace-credential:
        attributes:
          credential_signing_alg_values_supported: ES256
          credential_build_config.signing_algorithm: ES256
          credential_build_config.token_jws_type: JWT
          credential_build_config.proof_types_supported:
            jwt:
              proof_signing_alg_values_supported:
                - ES256
          format: jwt_vc
          scope: MarketplaceCredential
          vct: MarketplaceCredential
          credential_build_config.visible_claims: roles,email
          credential_build_config.decoys: 3
        clientScope:
          create: true
        protocolMappers:
          - name: context-mapper
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
              supportedCredentialTypes: MarketplaceCredential
  # `keyAlgorithm` must match the PKCS12 key and `credential_signing_alg_values_supported`.
  signingKey:
    storePath: /did-material/cert.pfx
    storePassword: "${STORE_PASS}"
    keyAlias: didPrivateKey
    keyPassword: "${STORE_PASS}"
    keyAlgorithm: ES256
    did: did:web:did-central-marketplace.example.com

# TMForum APIs (business layer for marketplace + contract-management).
# `allInOne` = single pod instead of one per API; persisted on Scorpio (NGSI-LD).
tm-forum-api:
  enabled: true
  allInOne:
    enabled: true
  defaultConfig:
    serverHost: http://tm-forum-api-svc:8080
    ngsiLd:
      url: http://data-service-scorpio:9090
    contextUrl: https://raw.githubusercontent.com/SEAMWARE/fdsc-edc/refs/heads/main/schemas/odrl-context.jsonld
    additionalEnvVars:
      - name: API_EXTENSION_ENABLED
        value: "true"
      - name: GENERAL_NGSILDORQUERYVALUE
        value: ","
      - name: GENERAL_NGSILDORQUERYKEY
        value: ","
      - name: GENERAL_ENCLOSEQUERY
        value: "false"
  apiProxy:
    enabled: false
  redis:
    enabled: false
  registration:
    enabled: false

# Contract-management — central-marketplace mode. Aggregates offerings across
# participants and orchestrates orders. `enableCentralMarketplace: true` flips
# the deployment into broker mode (no local ODRL-PAP / TIL; calls remote ones).
contract-management:
  enabled: true
  enableRainbow: false
  fullnameOverride: contract-management
  did: did:web:did-central-marketplace.example.com
  enableCentralMarketplace: true
  enableOdrlPap: false
  enableTrustedIssuersList: false
  organization:
    provider:
      role: seller
  # OID4VP holder config — contract-management presents the marketplace-credential
  # (fetched by the `credentials` subchart) when calling protected participant APIs.
  oid4vp:
    enabled: true
    credentialsFolder: /credential-repo
    trustAnchors: []
    holder:
      holderId: did:web:did-central-marketplace.example.com
      keyType: EC
      keyPath: /app/resources/signing-key/tls.key
      signatureAlgorithm: ECDH-ES
  services:
    product-order:
      url: http://tm-forum-api-svc:8080
    party:
      url: http://tm-forum-api-svc:8080
    product-catalog:
      url: http://tm-forum-api-svc:8080
    service-catalog:
      url: http://tm-forum-api-svc:8080
    tmforum-agreement-api:
      url: http://tm-forum-api-svc:8080
    quote:
      url: http://tm-forum-api-svc:8080
  additionalEnvVars:
    - name: LOGGER_LEVELS_ROOT
      value: DEBUG
  deployment:
    image:
      tag: 3.3.8
    # Bootstrap chain:
    #   1. wait-for-keycloak  → blocks until KC /health/ready responds
    #   2. get-credential     → fetches the marketplace-credential JWT into /credential-repo
    # Pinning a marketplace-credential file decouples pod startup from KC availability.
    initContainers:
      - name: wait-for-keycloak
        image: curlimages/curl:8.6.0
        command:
          - sh
          - -c
          - |
            set -e
            echo "Waiting for Keycloak to become ready..."

            until curl -sf http://central-marketplace-keycloak:9000/health/ready > /dev/null; do
              echo "Keycloak not ready yet, retrying..."
              sleep 5
            done
            echo "Keycloak is ready."
      - name: get-credential
        image: quay.io/curl/curl:8.1.2
        command: ["/bin/sh", "-c", "/bin/get-credential.sh /credential-repo"]
        volumeMounts:
          - name: credentials-script
            mountPath: /bin/get-credential.sh
            subPath: get-credential.sh
          - name: credential-repo
            mountPath: /credential-repo
    additionalVolumes:
      - name: signing-key
        secret:
          secretName: did-central-marketplace.example.com-tls
          items:
            - key: tls.key
              path: tls.key
      - name: credentials-script
        configMap:
          name: credentials-script
          defaultMode: 0755
      - name: credential-repo
        emptyDir: {}
    additionalVolumeMounts:
      - name: credential-repo
        mountPath: /credential-repo
      - name: signing-key
        mountPath: /app/resources/signing-key/tls.key
        subPath: tls.key
  notification:
    enabled: true
    host: contract-management

# Publishes the DID Document at https://did-central-marketplace.example.com/did.json.
# Use `did:web` (not `did:key`) — `did:key` ties the identity to the key, blocking rotation.
did:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: prod
      cert-manager.io/common-name: did-central-marketplace.example.com
      cert-manager.io/private-key-algorithm: ECDSA
      cert-manager.io/private-key-encoding: PKCS8
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - host: did-central-marketplace.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: did-central-marketplace.example.com-tls
        hosts:
          - did-central-marketplace.example.com
  volumes:
    - name: certs
      secret:
        secretName: did-central-marketplace.example.com-tls
        items:
          - key: tls.crt
            path: tls.crt
  volumeMounts:
    - name: certs
      mountPath: /certs
  config:
    server:
      hostUrl: https://did-central-marketplace.example.com
      runServer: "true"
      certPath: /certs/tls.crt
      keystorePasswordSecretName: ""
      keystorePasswordSecretKey: ""
      keyAlias: "myAlias"
    generateKey:
      enabled: false

# Marketplace (BAE) — central storefront aggregating offerings across participants.
# Login is VC-based via SIOP against this deployment's own Verifier.
marketplace:
  enabled: true
  generatePasswords: false

  # SIOP login flow: marketplace renders QR (host+qrCodePath) → user presents VC
  # at the Verifier → JWT posted to tokenPath → validated against jwksPath.
  # `clientId` reuses the marketplace DID. `allowedRoles` is the post-token AuthZ filter.
  siop:
    clientId: did:web:did-central-marketplace.example.com
    verifier:
      host: https://verifier-central-marketplace.example.com
      qrCodePath: /api/v2/loginQR
      tokenPath: /token
      jwksPath: /.well-known/jwks
    allowedRoles:
      - seller
      - customer
      - admin
  # Public URL — must match `bizEcosystemLogicProxy.ingress` host (used in redirects/emails).
  externalUrl: https://central-marketplace.example.com

  # Billing/pricing engine. Wired to local TMForum CustomerBill + Party APIs.
  bizEcosystemChargingBackend:
    deployment:
      image:
        tag: 11.4.0
      livenessProbe:
        initialDelaySeconds: 20
      readinessProbe:
        initialDelaySeconds: 20
    extraEnvVars:
      - name: BAE_CB_CUSTOMER_BILL
        value: "http://tm-forum-api-svc:8080/tmf-api/customerBillManagement/v4"
      - name: BAE_CB_PARTY
        value: "http://tm-forum-api-svc:8080/tmf-api/party/v4"

  # BAE → TMForum adapter. All entries point at the local all-in-one tm-forum-api-svc;
  # split per-service if you deploy TMForum as separate microservices.
  bizEcosystemApis:
    deployment:
      livenessProbe:
        initialDelaySeconds: 20
      readinessProbe:
        initialDelaySeconds: 20
    tmForum:
      catalog:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/productCatalogManagement/v4
      inventory:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/productInventory/v4
      ordering:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/productOrderingManagement/v4
      billing:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/accountManagement/v4
      usage:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/usageManagement/v4
      party:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/party/v4
      customer:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/customerManagement/v4
      resources:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/resourceCatalog/v4
      services:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/serviceCatalogManagement/v4
      resourceInventory:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/resourceInventoryManagement/v4
      serviceInventory:
        host: tm-forum-api-svc
        port: 8080
        path: /tmf-api/serviceInventory/v4

  # User-facing UI + API gateway. StatefulSet (on-disk session state).
  # Only marketplace component with an Ingress.
  bizEcosystemLogicProxy:
    statefulset:
      livenessProbe:
        initialDelaySeconds: 20
      readinessProbe:
        initialDelaySeconds: 20
      image:
        tag: 11.15.0
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: "prod"
        cert-manager.io/private-key-algorithm: "ECDSA"
        cert-manager.io/common-name: "central-marketplace.example.com"
        kubernetes.io/ingress.class: "nginx"
      hosts:
        - host: central-marketplace.example.com
          paths:
            - "/"
      tls:
        - secretName: central-marketplace.example.com-tls
          hosts:
            - central-marketplace.example.com
    # Mount the DID private key (used to sign SIOP requests).
    extraVolumeMounts:
      - name: did-priv-key
        mountPath: /certs-did
    extraContainerVolumes:
      - name: did-priv-key
        secret:
          secretName: did-central-marketplace.example.com-tls

    # BAE_LP_SIOP_IS_REDIRECTION → redirect-based SIOP (vs QR)
    # BAE_LP_PURCHASE_ENABLED    → enable buy flow
    # BAE_LP_BILLING_ENGINE_URL  → in-cluster charging backend
    # BAE_LP_DATASPACE_ENABLED   → enable TIL/VC extensions
    # BAE_LP_SIOP_PRIVATE_KEY_PEM→ DID private key path
    # URL format: <release>-biz-ecosystem-charging-backend.<namespace>.svc.cluster.local
    # Hardcoded to release=`central-marketplace`, namespace=`central-marketplace`.
    additionalEnvVars:
      - name: BAE_LP_SIOP_IS_REDIRECTION
        value: "true"
      - name: BAE_LP_PURCHASE_ENABLED
        value: "true"
      - name: BAE_LP_BILLING_ENGINE_URL
        value: "http://central-marketplace-biz-ecosystem-charging-backend.central-marketplace.svc.cluster.local:8006/charging/api/orderManagement/orders/preview/"
      - name: BAE_LP_DATASPACE_ENABLED
        value: "true"
      - name: BAE_LP_SIOP_PRIVATE_KEY_PEM
        value: /certs-did/tls.key

# Bootstrap job: logs into Keycloak as the seed user and fetches a
# marketplace-credential JWT, leaving it where contract-management can mount it.
# Reuses the `&employee_password` anchor from the realm seed user.
credentials:
  enabled: true
  keycloak:
    address: http://central-marketplace-keycloak:8080
    realm: central
    clientId: account-console
    username: employee
    scope: openid
    password: *employee_password
  configurations:
    - id: marketplace-credential
      format: jwt_vc
      targetFile: marketplace-credential.jwt

# Extra raw manifests:
#   1. ca-cert Secret           → LE CA chain bundled into Keycloak's PKCS12.
#   2. verifier RSA Certificate → RSA signing key for the verifier (APISIX needs RSA).
extraManifests:
  # LE CA chain bundled into the PKCS12 keystore by the Keycloak `get-did` init.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ca-cert
      namespace: central-marketplace
    type: Opaque
    data:
      ca.crt: 
  # RSA cert for the verifier's JWT signing (mounted as volume `signing-certs-vol`).
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: verifier-internal-rsa-cert
      namespace: central-marketplace
    spec:
      commonName: verifier-central-marketplace.example.com
      dnsNames:
        - verifier-central-marketplace.example.com
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: prod
      privateKey:
        algorithm: RSA
      secretName: verifier-rsa-cert
      usages:
        - key encipherment

# Disabled subcharts:
#   elsi              → Gaia-X compliance overlay (per-env)
#   rainbow           → alternative authz stack (we use ODRL+OPA on the provider side)
#   registration / dataSpaceConfig → first-install bootstrap helpers
#   fdsc-edc / identityhub         → Eclipse Dataspace Components (we use OID4VP only)
#   vault             → using sealed-secrets instead
elsi:
  enabled: false

rainbow:
  enabled: false

registration:
  enabled: false

dataSpaceConfig:
  enabled: false

fdsc-edc:
  enabled: false

identityhub:
  enabled: false

vault:
  enabled: false
