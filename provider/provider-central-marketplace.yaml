# ─────────────────────────────────────────────────────────────────────────────
# DISCLAIMER — Training / educational example only.
# Do NOT deploy as-is in production. The seed user password is hardcoded
# ("test") for the bootstrap flow; review credentials, hostnames, cert
# issuers, resource sizing, persistence, and disabled subcharts first.
# ─────────────────────────────────────────────────────────────────────────────
# Provider deployment example for DSC chart 10.4.12, configured to participate in
# the central marketplace. Helm release name is `provider-central-mp` (referenced
# in init-containers, APISIX service names, and the extraManifests Ingress).
# Differences vs `provider.yaml`:
#   * Marketplace (BAE) disabled — the central marketplace owns it
#   * APISIX exposes contract-management-provider.example.com (in addition to
#     mp-data-service.example.com) so the central marketplace can call it
#   * Keycloak gains a `dashboard` client + roles for the fdsc-dashboard
#   * `credentials` subchart bootstraps a marketplace-credential JWT
#   * contract-management runs with `enableCentralMarketplace: true`

# Off = `issuance-secret` is provisioned externally (sealed-secrets/Vault).
issuance:
  generatePasswords:
    enabled: false

# Marketplace is OFF in the provider — central-marketplace owns it.
mongo-operator:
  enabled: false
managedMongo:
  enabled: false

# cert-manager: ingress TLS + internal signing certs (verifier + DID, both EC).
# If jetstack/cert-manager already runs cluster-wide, set `cert-manager.enabled:
# false` but keep `certManagerResources` for the ClusterIssuer/Certificate manifests.
cert-manager:
  enabled: true
certManagerResources:
  enabled: true
  namespace: cert-manager
  type: "prod"

# decentralizedIam: AuthN (vcAuthentication) + AuthZ (odrlAuthorization).
decentralizedIam:
  enabled: true

  vcAuthentication:
    enabled: true

    # `postgres-operator.enabled: false` — operator is installed cluster-wide
    # (e.g. by the central-marketplace deploy). We only declare the cluster.
    postgres-operator:
      enabled: false
    # Zalando Postgres cluster shared by TIL/CCS/PAP/Keycloak/Scorpio.
    # PostGIS prepared on `scorpio` for NGSI-LD geo queries.
    managedPostgres:
      enabled: true
      config:
        teamId: "dsc"
        numberOfInstances: 1
        postgresql:
          version: "16"
        volume:
          size: 8Gi
          storageClass: gp2  # AWS EKS — change for non-EKS clusters
        users:
          admin:    [superuser, createdb]
          til:      [createdb]
          ccs:      [createdb]
          pap:      [createdb]
          keycloak: [createdb]
          scorpio:  [createdb, superuser]
        databases:
          tildb: til
          ccsdb: ccs
          papdb: pap
          keycloakdb: keycloak
          scorpio: scorpio
        preparedDatabases:
          scorpio:
            extensions:
              postgis: public

    # TIL: local "is issuer X trusted for credential Y?" service. Internal-only.
    trusted-issuers-list:
      enabled: true
      fullnameOverride: trusted-issuers-list
      database:
        persistence: true
        dialect: POSTGRES
        host: postgres
        port: 5432
        username: til
        existingSecret:
          enabled: true
          name: til.postgres.credentials.postgresql.acid.zalan.do
          key: password
        name: tildb
      ingress:
        til: { enabled: false }
        tir: { enabled: false }

    # CCS: per-service config "to access X, present VC of type Y from issuer Z".
    # Three services registered:
    #   ${DID}              → LegalPersonCredential (participant login)
    #   data-service        → OperatorCredential (gated NGSI-LD broker)
    #   contract-management → MarketplaceCredential, DCQL query, DEEPLINK auth
    #                         (called by the central marketplace; `*` issuers list
    #                         because the central mp's DID may not be in our TIL)
    # CCS (Credentials Config Service) is embedded in the verifier in DSC 10.x
    # (served by `vcverifier.deployment.configServer` on :8090). The standalone
    # subchart stays disabled; its database + service registration now live under
    # `vcverifier` below.
    credentials-config-service:
      enabled: false

    # Verifier: OIDC endpoint that exchanges a VC for a JWT (via OID4VP).
    # Two keys mounted:
    #   /certs         → ECDSA TLS cert for `x509_san_dns` client identification
    #   /certs-signing → ECDSA token-signing key
    vcverifier:
      enabled: true
      fullnameOverride: verifier
      m2m:
        authEnabled: false
      # Service registration (post-install job) posts each service's required
      # credentials/scopes to the embedded CCS (configServer on :8090).
      # `${DID}` is a runtime env var exported by `prepScript`, NOT a Helm template.
      registration:
        enabled: true
        prepScript: export DID=did:web:did-provider.example.com:did
        services:
          - id: ${DID}
            defaultOidcScope: "openid learcredential"
            authorizationType: "FRONTEND_V2"
            oidcScopes:
              "openid learcredential":
                credentials:
                  - type: LegalPersonCredential
                    trustedParticipantsLists:
                      - https://tir.example.com
                    trustedIssuersLists:
                      - http://trusted-issuers-list:8080
                    jwtInclusion:
                      enabled: true
                      fullInclusion: true
                presentationDefinition:
                  id: pd
                  input_descriptors:
                    - id: descriptor
                      constraints:
                        fields:
                          - id: vct
                            path: [$.vct]
                            filter: { const: "LegalPersonCredential" }
                          - id: subject
                            path: [$.firstName]
                          - id: roles
                            path: [$.roles]
                      format:
                        "dc+sd-jwt":
                          alg: [ES256]
                  format:
                    "dc+sd-jwt":
                      alg: [ES256]

          - id: data-service
            defaultOidcScope: "operator"
            authorizationType: "FRONTEND_V2"
            oidcScopes:
              "operator":
                credentials:
                  - type: OperatorCredential
                    trustedParticipantsLists:
                      - https://tir.example.com
                    trustedIssuersLists:
                      - http://trusted-issuers-list:8080
                    jwtInclusion:
                      enabled: true
                      fullInclusion: true
                presentationDefinition:
                  id: pd
                  input_descriptors:
                    - id: descriptor
                      constraints:
                        fields:
                          - id: vct
                            path: [$.vct]
                            filter: { const: "OperatorCredential" }
                          - id: subject
                            path: [$.firstName]
                          - id: roles
                            path: [$.roles]
                      format:
                        "dc+sd-jwt":
                          alg: [ES256]
                  format:
                    "dc+sd-jwt":
                      alg: [ES256]

          # DCQL (Digital Credentials Query Language) instead of presentationDefinition,
          # matching the JWT-VC MarketplaceCredential that the central marketplace presents.
          - id: contract-management
            defaultOidcScope: "external-marketplace"
            authorizationType: "DEEPLINK"
            oidcScopes:
              "external-marketplace":
                credentials:
                  - type: MarketplaceCredential
                    trustedParticipantsLists:
                      - https://tir.example.com
                    trustedIssuersLists:
                      - "*"
                    jwtInclusion:
                      enabled: true
                      fullInclusion: true
                dcql:
                  credentials:
                    - id: mc-query
                      format: "jwt_vc_json"
                      multiple: true
                      meta:
                        type_values:
                          - ["MarketplaceCredential"]
      ingress:
        enabled: true
        className: "nginx"
        annotations:
          cert-manager.io/cluster-issuer: prod
          cert-manager.io/private-key-algorithm: ECDSA
          cert-manager.io/common-name: verifier.example.com
        hosts:
          - host: verifier.example.com
            paths: ["/"]
        tls:
          - secretName: verifier.example.com-tls
            hosts: [verifier.example.com]
      deployment:
        # Embedded Credentials Config Service: serves the config REST API on :8090
        # backed by the ccs database below — replaces the standalone CCS subchart.
        configServer:
          enabled: true
        database:
          name: ccsdb
          host: postgres
          type: postgres
          existingSecret:
            name: ccs.postgres.credentials.postgresql.acid.zalan.do
            usernameKey: username
            passwordKey: password
        logging: { level: debug }
        verifier:
          tirAddress: http://trusted-issuers-list:8080/
          did: did:web:did-provider.example.com:did
          supportedModes: [byValue, byReference]
          generateKey: false
          keyAlgorithm: ES256
          sessionExpiry: 60
          keyPath: /certs-signing/tls.key
          clientIdentification:
            kid: random-kid1
            keyPath: /certs/tls.key
            requestKeyAlgorithm: ES256
            id: x509_san_dns:verifier.example.com
            certificatePath: /certs/tls.crt
        server:
          host: https://verifier.example.com
        configRepo:
          configEndpoint: http://verifier:8090
        additionalVolumes:
          - name: certs-vol
            secret:
              secretName: verifier.example.com-tls
          - name: signing-certs-vol
            secret:
              secretName: verifier-signing-cert
        additionalVolumeMounts:
          - name: certs-vol
            mountPath: /certs
          - name: signing-certs-vol
            mountPath: /certs-signing
        # Auto-registers this DID at the dataspace TIR.
        # Dev/test only — in prod the onboarding portal registers participants.
        initContainers:
          - name: register-at-tir
            image: curlimages/curl:8.7.1
            args:
              - -v
              - -X
              - POST
              - "http://tir.trust-anchor.svc.cluster.local:8080/issuer"
              - -H
              - "Content-Type: application/json"
              - -d
              - '{"did": "did:web:did-provider.example.com:did", "credentials": []}'

  # Authorization stack — request path: client → APISIX → upstream service.
  # APISIX plugins per route: `openid-connect` (validate JWT) + `opa` (eval ODRL policy).
  odrlAuthorization:
    apisix:
      apisix:
        nginx:
          logs:
            errorLogLevel: debug
      admin:
        enabled: true
        cors: false
        # EKS service CIDR (10.100.0.0/16) + AWS VPC CNI pod IPs (172.31.0.0/16)
        # + loopback inside the apisix pod.
        allow:
          ipList:
            - 127.0.0.1/24
            - 10.100.0.0/16
            - 172.31.0.0/16
      etcd:
        # 1 replica instead of chart default (3); HA not needed at this scale.
        replicaCount: 1
        persistence:
          storageClass: gp2  # AWS EKS — change for non-EKS clusters
      # Both APISIX-bundled ingress controller and Ingress disabled — we render
      # our own nginx Ingress in `extraManifests` (chart Ingress lacks annotations).
      ingress-controller:
        enabled: false
      ingress:
        enabled: false
      catchAllRoute:
        enabled: false
      # Static APISIX routes, two protected upstreams:
      #   contract-management-provider.example.com → contract-management (gated)
      #   mp-data-service.example.com              → Scorpio data plane (gated)
      # Each host gets a `.well-known/openid-configuration` rewrite to the matching
      # verifier service config, plus a catch-all `/*` with `openid-connect` + `opa`.
      routes:
        # ── contract-management-provider.example.com (called by central marketplace)
        - uri: /*/.well-known/openid-configuration
          host: contract-management-provider.example.com
          upstream:
            nodes:
              verifier:3000: 1
            type: roundrobin
          plugins:
            proxy-rewrite:
              uri: /services/contract-management/.well-known/openid-configuration
        - uri: /*
          host: contract-management-provider.example.com
          upstream:
            nodes:
              contract-management:8080: 1
            type: roundrobin
          plugins:
            openid-connect:
              bearer_only: true
              use_jwks: true
              client_id: contract-management
              client_secret: unused
              ssl_verify: false
              discovery: http://verifier:3000/services/contract-management/.well-known/openid-configuration
            opa:
              host: http://localhost:8181
              policy: policy/main
              with_body: true
        # ── mp-data-service.example.com (Scorpio NGSI-LD data plane)
        - uri: /.well-known/openid-configuration
          host: mp-data-service.example.com
          upstream:
            nodes:
              verifier:3000: 1
            type: roundrobin
          plugins:
            proxy-rewrite:
              uri: /services/data-service/.well-known/openid-configuration
        - uri: /*
          host: mp-data-service.example.com
          upstream:
            nodes:
              data-service-scorpio:9090: 1
            type: roundrobin
          plugins:
            openid-connect:
              bearer_only: true
              use_jwks: true
              client_id: data-service
              client_secret: unused
              ssl_verify: false
              discovery: https://verifier.example.com/services/data-service/.well-known/openid-configuration
            opa:
              host: http://localhost:8181
              policy: policy/main
              with_body: true

    # ODRL-PAP: policy admin point; exposes ODRL policies as an OPA bundle.
    # GENERAL_ORGANIZATION_DID is injected via additionalEnvVars (the 1.4.x
    # entrypoint workaround is no longer needed in the 10.4.12 default image).
    odrl-pap:
      enabled: true
      fullnameOverride: odrl-pap
      database:
        url: jdbc:postgresql://postgres:5432/papdb
        username: pap
        existingSecret:
          enabled: true
          name: pap.postgres.credentials.postgresql.acid.zalan.do
          key: password
      additionalEnvVars:
        - name: GENERAL_ORGANIZATION_DID
          value: did:web:did-provider.example.com:did
      ingress:
        enabled: false

    # OPA: APISIX sidecar; polls the ODRL-PAP bundle at `resourceUrl`.
    opa:
      enabled: true
      resourceUrl: http://odrl-pap:8080/bundles/service/v1
      port: 8181
      policies: { minDelay: 2, maxDelay: 4 }
      methods:  { minDelay: 1, maxDelay: 3 }
      data:     { minDelay: 1, maxDelay: 15 }

    # TPP (Trusted Participants Provider): optional DID resolver against the dataspace TIR.
    tpp:
      enabled: false

# Scorpio (NGSI-LD broker) — the data service protected by APISIX.
# `all-in-one-runner` packs all subcomponents in one pod. No ingress: APISIX-only access.
scorpio:
  enabled: true
  fullnameOverride: data-service-scorpio
  db:
    dbhost: postgres                     # 8.x: data-service-postgis
    user: scorpio
    existingSecret:
      enabled: true
      name: scorpio.postgres.credentials.postgresql.acid.zalan.do
      key: password
  additionalEnvVars:
    - name: DBNAME
      value: scorpio
  ingress: { enabled: false }
  readinessProbe: { path: /q/health }
  livenessProbe:  { path: /q/health }
  service: { type: ClusterIP }
  ccs:
    enabled: false                       # provider does not auto-register
    endpoint: http://verifier:8090

# Keycloak: dual role — IDP for humans + VC Issuer (OID4VCI). Realm `provider`.
# The org DID private key MUST be Keycloak's VC-signing key (see `get-did` initContainer).
# DSC 10.4.x uses the CloudPirates Keycloak chart (0.21.28) with the UPSTREAM
# image `docker.io/keycloak/keycloak:26.7.0` as the chart default — no image
# override needed. The SEAMWARE fork (quay.io/seamware/keycloak:26.6.3) existed
# only to carry the OID4VCI QR-endpoint fix (keycloak/keycloak#44623) and the
# Liquibase changeset `26.7.0-verifiable-credential`; both are upstream in
# 26.7.0, so it was dropped in 10.4.0. The umbrella still enables the three
# oid4vc-vci feature flags.
keycloak:
  enabled: true
  metrics: { enabled: true }
  # Admin credentials live under the CloudPirates `keycloak.keycloak.*` block.
  keycloak:
    adminUser: keycloak-admin
    existingSecret: issuance-secret
    secretKeys:
      adminPasswordKey: keycloak-admin
    proxyHeaders: xforwarded
  tls: { enabled: false }
  service:
    httpPort: 8080
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/common-name: accounts.example.com
      cert-manager.io/cluster-issuer: prod
    hosts:
      - host: accounts.example.com
        paths:
          - { path: /, pathType: Prefix }
    tls:
      - secretName: accounts.example.com-tls
        hosts: [accounts.example.com]
  resources:
    requests: { memory: "500Mi", cpu: "0.5" }
    limits:   { memory: "2Gi",   cpu: "1" }
  livenessProbe:  { failureThreshold: 20 }
  readinessProbe: { failureThreshold: 20 }
  postgres: { enabled: false }
  database:
    host: postgres
    name: keycloakdb
    username: keycloak
    existingSecret: keycloak.postgres.credentials.postgresql.acid.zalan.do
    secretKeys:
      usernameKey: username
      passwordKey: password
  extraVolumeMounts:
    # Since Keycloak 26.6.4 the `java-keystore` realm key provider only reads
    # keystores under `${kc.home.dir}/data/<realm-name>` (/opt/keycloak/data on
    # the official image). The directory name MUST equal `keycloak.realm.name`
    # below; keystores outside that boundary break any update of the key provider.
    # The `get-did` initContainer keeps its own /did-material view of the same
    # emptyDir — only the Keycloak container's mount is constrained.
    - { name: did-material, mountPath: /opt/keycloak/data/provider }
    - { name: realms,       mountPath: /opt/keycloak/data/import }
  extraVolumes:
    - name: did-material
      emptyDir: {}
    - name: realms
      # ConfigMap rendered by the chart from `keycloak.realm` below.
      configMap: { name: provider-realm }
    - name: did-priv-key
      secret: { secretName: did-provider.example.com-tls }
    - name: ca-cert
      secret: { secretName: ca-cert }
  # Builds a PKCS12 keystore from the cert-manager PEM keypair (Keycloak signs VCs
  # from PKCS12, not PEM). Alias `didPrivateKey` matches `signingKey.keyAlias`.
  extraInitContainers:
    - name: get-did
      image: alpine/openssl:3.5.5
      command: ["/bin/sh", "-c"]
      args:
        - |
          openssl pkcs12 -export \
            -in /certs-did/tls.crt \
            -inkey /certs-did/tls.key \
            -out /did-material/cert.pfx \
            -certfile /ca-certs/ca.crt \
            -name "didPrivateKey" \
            -passout env:STORE_PASS
          chmod 644 /did-material/cert.pfx
      env:
        - name: STORE_PASS
          valueFrom:
            secretKeyRef: { name: issuance-secret, key: store-pass }
      volumeMounts:
        - { name: did-material, mountPath: /did-material }
        - { name: did-priv-key, mountPath: /certs-did }
        - { name: ca-cert,      mountPath: /ca-certs }
  # The umbrella enables the OID4VCI feature flags and `--import-realm` by default.
  # extraEnvVars REPLACES the umbrella list, so KC_HEAP_SIZE must be repeated here.
  # DID → substituted into ${DID} at realm import time.
  extraEnvVars:
    - name: KC_HEAP_SIZE
      value: "1024m"
    - name: DID
      value: did:web:did-provider.example.com:did
    - name: STORE_PASS
      valueFrom:
        secretKeyRef: { name: issuance-secret, key: store-pass }

  # Realm structured import.
  realm:
    import: true
    name: provider
    frontendUrl: https://accounts.example.com
    sslRequired: none
    # Keycloak 26.7.0 ties /create-credential-offer to a per-user
    # verifiableCredentials list; auto-assign the full declared set to every user.
    wallets:
      issueCredentialsToUsers: true

    # Convention: ONE client per *target participant*, `clientId == that peer's DID`.
    # Roles on that client → emitted in the VC with `target` = that DID
    # (via oid4vc-target-role-mapper). Additionally, `dashboard` client roles
    # drive access to the fdsc-dashboard via standard OIDC.
    clientRoles:
      ${DID}:
        - { name: customer,       description: "Is allowed to see offers etc.",  clientRole: true }
        - { name: OPERATOR,       description: "Is allowed to operate clusters.", clientRole: true }
        - { name: REPRESENTATIVE, description: "Is allowed to register.",         clientRole: true }
        - { name: seller,         description: "Seller role",                     clientRole: true }
        - { name: admin,          description: "Admin role",                      clientRole: true }
      # Roles for the FDSC dashboard (dashboard.auth.config.providers[0].roleMapping
      # maps `fdsc-admin` → admin and `fdsc-viewer` → viewer claims to these).
      dashboard:
        - { name: admin,  description: "Dashboard admin",  clientRole: true }
        - { name: viewer, description: "Dashboard viewer", clientRole: true }

    # Seed user for the bootstrap flow. Password is anchored (&employee_password)
    # and reused below by the `credentials` subchart to fetch a marketplace-credential.
    # WARNING: hardcoded password — training only, replace with a Secret-backed
    # value (or rotate immediately) in any non-disposable environment.
    users:
      - username: employee
        enabled: true
        email: employee@provider.org
        firstName: Test
        lastName: User
        credentials:
          - { type: password, value: &employee_password "test" }
        clientRoles:
          ${DID}: [seller, admin]
          account: [view-profile, manage-account]
          dashboard: [admin]
        groups:
          - /consumer

    # Two clients:
    #   ${DID}    → self-client (VC issuance via OID4VCI, `protocol: oid4vc`)
    #   dashboard → public OIDC client for the fdsc-dashboard UI; emits
    #               `client_roles` claim consumed by the dashboard auth config.
    clients:
      - clientId: ${DID}
        enabled: true
        description: Client to manage itself
        surrogateAuthRequired: false
        alwaysDisplayInConsole: false
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris: []
        webOrigins: []
        notBefore: 0
        bearerOnly: false
        consentRequired: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        publicClient: false
        frontchannelLogout: false
        protocol: oid4vc
        protocolMappers: []
        authenticationFlowBindingOverrides: {}
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: []
        optionalClientScopes: []

      - clientId: dashboard
        enabled: true
        description: Client to access the FDSC dashboard
        surrogateAuthRequired: false
        alwaysDisplayInConsole: false
        clientAuthenticatorType: client-secret
        defaultRoles: []
        redirectUris:
          - https://dashboard-provider.example.com/callback/keycloak
        webOrigins:
          - https://dashboard-provider.example.com
        notBefore: 0
        bearerOnly: false
        consentRequired: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        publicClient: true
        frontchannelLogout: false
        protocol: openid-connect
        protocolMappers:
          - name: client-roles-mapper
            protocol: openid-connect
            protocolMapper: oidc-usermodel-client-role-mapper
            consentRequired: false
            config:
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: "client_roles"
              jsonType.label: "String"
              usermodel.clientRoleMapping.clientId: "dashboard"
        authenticationFlowBindingOverrides: {}
        fullScopeAllowed: true
        nodeReRegistrationTimeout: -1
        defaultClientScopes: ["openid", "profile", "roles"]
        optionalClientScopes: []

    # VC types this realm issues (OID4VCI, post-KC 26.4 model). Each entry renders one
    # ClientScope (protocol "oid4vc"); the key is the credential_configuration_id.
    # `credential_signing_alg` MUST match `signingKey.keyAlgorithm` and the PKCS12 key.
    verifiableCredentials:
      user-sd:
        attributes:
          format: "dc+sd-jwt"
          verifiable_credential_type: "LegalPersonCredential"
          credential_signing_alg: "ES256"
          credential_build_config.token_jws_type: "dc+sd-jwt"
          # SD-JWT red list (iss,iat,nbf,exp,cnf,vct,status) MUST stay disclosed.
          credential_build_config.sd_jwt.visible_claims: "iss,iat,nbf,exp,cnf,vct,status,roles,email"
          sd_jwt.number_of_decoys: "3"
          binding_required: "false"
          binding_required_proof_types: "jwt"
          cryptographic_binding_methods_supported: "jwk"
        protocolMappers:
          - name: context-mapper-usd
            protocol: oid4vc
            protocolMapper: oid4vc-context-mapper
            config:
              context: https://www.w3.org/2018/credentials/v1
          - name: email-mapper-usd
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: email
              userAttribute: email
          - name: firstName-mapper-usd
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: firstName
              userAttribute: firstName
          - name: lastName-mapper-usd
            protocol: oid4vc
            protocolMapper: oid4vc-user-attribute-mapper
            config:
              claim.name: lastName
              userAttribute: lastName
          - name: role-mapper-usd
            protocol: oid4vc
            protocolMapper: oid4vc-target-role-mapper
            config:
              claim.name: roles
              clientId: ${DID}

  # `keyAlgorithm` must match the PKCS12 key and `credential_signing_alg`.
  signingKey:
    storePath: /opt/keycloak/data/provider/cert.pfx
    storePassword: "${STORE_PASS}"
    keyAlias: didPrivateKey
    keyPassword: "${STORE_PASS}"
    keyAlgorithm: ES256
    did: did:web:did-provider.example.com:did

# TMForum APIs (business layer for marketplace + contract-management).
# `allInOne` = single pod instead of one per API; persisted on Scorpio (NGSI-LD).
tm-forum-api:
  enabled: true
  allInOne:
    enabled: true
  defaultConfig:
    serverHost: http://tm-forum-api-svc:8080
    ngsiLd:
      url: http://data-service-scorpio:9090
    contextUrl: https://raw.githubusercontent.com/SEAMWARE/fdsc-edc/refs/heads/main/schemas/odrl-context.jsonld
    additionalEnvVars:
      - { name: API_EXTENSION_ENABLED,    value: "true" }
      - { name: GENERAL_NGSILDORQUERYVALUE, value: "," }
      - { name: GENERAL_NGSILDORQUERYKEY,   value: "," }
      - { name: GENERAL_ENCLOSEQUERY,       value: "false" }
  apiProxy: { enabled: false }
  redis:    { enabled: false }
  registration: { enabled: false }
  ingress: { enabled: false }

# Contract-management — central-marketplace participant mode.
# `enableCentralMarketplace: true` makes it consume offerings from the central mp;
# local ODRL-PAP stays enabled to enforce policies on this provider's resources.
# OID4VP holder: presents a marketplace-credential (fetched by `credentials` below)
# when calling the central marketplace APIs.
contract-management:
  enabled: true
  enableRainbow: false
  fullnameOverride: contract-management
  did: did:web:did-provider.example.com:did
  enableCentralMarketplace: true
  enableOdrlPap: true
  enableTrustedIssuersList: false
  organization:
    provider:
      role: seller
  oid4vp:
    enabled: true
    credentialsFolder: /credential-repo
    trustAnchors: []
    holder:
      holderId: did:web:did-provider.example.com:did
      keyType: EC
      keyPath: /app/resources/signing-key/tls.key
      signatureAlgorithm: ECDH-ES
  services:
    product-order:    { url: http://tm-forum-api-svc:8080 }
    party:            { url: http://tm-forum-api-svc:8080 }
    product-catalog:  { url: http://tm-forum-api-svc:8080 }
    service-catalog:  { url: http://tm-forum-api-svc:8080 }
    quote:            { url: http://tm-forum-api-svc:8080 }
    odrl:             { url: http://odrl-pap:8080 }
    trusted-issuers-list: { url: http://trusted-issuers-list:8080 }
  til:
    credentialType: OperatorCredential
  notification:
    enabled: true
    host: contract-management
  deployment:
    # Bootstrap chain:
    #   1. wait-for-keycloak  → blocks until KC /health/ready responds
    #      (Service is `<release>-keycloak` → `provider-central-mp-keycloak`)
    #   2. get-credential     → logs in as `employee` and writes
    #                           /credential-repo/marketplace-credential.jwt
    initContainers:
      - name: wait-for-keycloak
        image: curlimages/curl:8.6.0
        command: [sh, -c]
        args:
          - |
            set -e
            echo "Waiting for Keycloak to become ready..."
            until curl -sf http://provider-central-mp-keycloak-metrics:9000/health/ready > /dev/null; do
              echo "Keycloak not ready yet, retrying..."
              sleep 5
            done
            echo "Keycloak is ready."
      - name: get-credential
        image: quay.io/curl/curl:8.1.2
        command: ["/bin/sh", "-c", "/bin/get-credential.sh /credential-repo"]
        volumeMounts:
          - { name: credentials-script, mountPath: /bin/get-credential.sh, subPath: get-credential.sh }
          - { name: credential-repo,    mountPath: /credential-repo }
    additionalVolumes:
      - name: signing-key
        secret:
          secretName: did-provider.example.com-tls
          items:
            - { key: tls.key, path: tls.key }
      - name: credentials-script
        configMap: { name: credentials-script, defaultMode: 0755 }
      - name: credential-repo
        emptyDir: {}
    additionalVolumeMounts:
      - { name: credential-repo, mountPath: /credential-repo }
      - { name: signing-key,     mountPath: /app/resources/signing-key/tls.key, subPath: tls.key }
  # NOTE: the contract-management sub-chart (3.5.22) does NOT ship an Ingress
  # template. Exposing `contract-management-provider.example.com` is done via
  # the APISIX data-plane Ingress (with OIDC+OPA gating) configured in
  # `decentralizedIam.odrlAuthorization.apisix` above.

# Publishes the DID Document at https://did-provider.example.com/did/did.json.
# Use `did:web` (not `did:key`) — `did:key` ties the identity to the key, blocking rotation.
did:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: prod
      cert-manager.io/common-name: did-provider.example.com
      cert-manager.io/private-key-algorithm: ECDSA
      cert-manager.io/private-key-encoding: PKCS8
    hosts:
      - host: did-provider.example.com
        paths:
          - { path: /, pathType: Prefix }
    tls:
      - secretName: did-provider.example.com-tls
        hosts: [did-provider.example.com]
  volumes:
    - name: certs
      secret:
        secretName: did-provider.example.com-tls
        items:
          - { key: tls.crt, path: tls.crt }
  volumeMounts:
    - { name: certs, mountPath: /certs }
  config:
    server:
      runServer: "true"
      certPath: /certs/tls.crt
      hostUrl: "https://did-provider.example.com/did"
      keystorePasswordSecretName: ""
      keystorePasswordSecretKey: ""
      keyAlias: "myAlias"
    generateKey:
      enabled: false

# Bootstrap job: logs into Keycloak as the seed user and fetches a
# marketplace-credential JWT, leaving it where contract-management can mount it.
# Reuses the `&employee_password` anchor from the realm seed user above.
credentials:
  enabled: true
  keycloak:
    address: http://provider-central-mp-keycloak:8080
    realm: provider
    clientId: account-console
    username: employee
    scope: openid
    password: *employee_password
  configurations:
    - id: marketplace-credential
      format: jwt_vc_json
      targetFile: marketplace-credential.jwt

# Disabled subcharts:
#   marketplace      → owned by the central-marketplace deploy
#   vault            → using sealed-secrets instead
#   fdsc-edc/identityhub → Eclipse Dataspace Components (we use OID4VP only)
#   elsi             → Gaia-X compliance overlay (per-env)
#   rainbow          → alternative authz stack (we use ODRL+OPA)
#   dataSpaceConfig/registration → first-install bootstrap helpers
marketplace:      { enabled: false }
vault:            { enabled: false }
fdsc-edc:         { enabled: false }
identityhub:      { enabled: false }
elsi:             { enabled: false }
rainbow:          { enabled: false }
dataSpaceConfig:  { enabled: false }
registration:     { enabled: false }

# Operator UI for TIL/CCS/ODRL-PAP/APISIX. Gated by the `dashboard` Keycloak client.
# `dashboardUrl` and `apisix-admin` service name are tied to the release name
# (`provider-central-mp`) — update if the release is renamed.
fdsc-dashboard:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: prod
      cert-manager.io/private-key-algorithm: ECDSA

    hosts:
      - host: dashboard-provider.example.com
        paths:
          - "/"
    tls:
      - secretName: dashboard-provider.example.com-tls
        hosts:
          - dashboard-provider.example.com
  apisix:
    enabled: true
    dashboardUrl: http://provider-central-mp-apisix-admin:9180/ui
    adminKey: admin  # APISIX default; rotate and source from a Secret in prod
  apiUrls:
    til: http://trusted-issuers-list:8080
    ccs: http://verifier:8090
    odrl: http://odrl-pap:8080
  auth:
    config:
      providers:
        - id: keycloak
          displayName: Keycloak
          issuer: https://accounts.example.com/realms/provider
          clientId: dashboard
          scopes: ["openid", "profile", "roles"]
          rolesClaimPath: "client_roles"
          roleMapping:
            admin: "admin"
          silentRenew: true

# Extra raw manifests:
#   1. ca-cert Secret           → LE CA chain bundled into Keycloak's PKCS12.
#   2. verifier Certificate     → EC (P-256) signing key for the verifier's JWTs.
#   3. nginx Ingress → APISIX gateway, multi-host TLS for the two protected
#                      backends (contract-management-provider + mp-data-service).
extraManifests:
  # CA chain mounted by Keycloak's get-did init container to bundle the LE
  # intermediate into the PKCS12 keystore used to sign credentials. Same blob
  # used by the central-marketplace deploy.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ca-cert
      namespace: provider-central-mp
    type: Opaque
    data:
      ca.crt: 
  # EC (P-256) cert for the verifier's JWT signing (mounted as volume `signing-certs-vol`).
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: verifier-internal-signing-cert
      namespace: provider-central-mp
    spec:
      commonName: verifier.example.com
      dnsNames:
        - verifier.example.com
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: prod
      privateKey:
        algorithm: ECDSA
        size: 256
      secretName: verifier-signing-cert
      usages:
        - digital signature
  # Multi-host Ingress fronting the APISIX gateway: both protected upstreams
  # share one nginx Ingress + one TLS cert (issued for both SANs).
  # Backend Service name is <helm-release>-apisix-gateway → `provider-central-mp-apisix-gateway`.
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: provider-central-mp-apisix
      namespace: provider-central-mp
      annotations:
        cert-manager.io/cluster-issuer: prod
        cert-manager.io/private-key-algorithm: ECDSA
    spec:
      ingressClassName: nginx
      rules:
        - host: contract-management-provider.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: provider-central-mp-apisix-gateway
                    port:
                      number: 80
        - host: mp-data-service.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: provider-central-mp-apisix-gateway
                    port:
                      number: 80
      tls:
        - secretName: contract-management-provider.example.com-tls
          hosts:
            - contract-management-provider.example.com
            - mp-data-service.example.com
